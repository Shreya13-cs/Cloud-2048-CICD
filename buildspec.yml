version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 056362973311.dkr.ecr.ap-southeast-2.amazonaws.com

  build:
    commands:
      - echo Building Docker image...
      - docker build -t cloud-2048 .
      - docker tag cloud-2048:latest 056362973311.dkr.ecr.ap-southeast-2.amazonaws.com/cloud-2048:latest

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push 056362973311.dkr.ecr.ap-southeast-2.amazonaws.com/cloud-2048:latest
      - echo Creating imagedefinitions.json...
      - printf '[{"name":"cloud-2048","imageUri":"056362973311.dkr.ecr.ap-southeast-2.amazonaws.com/cloud-2048:latest"}]' > imagedefinitions.json
      - echo Build completed successfully.

artifacts:
  files:
    - imagedefinitions.json